<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Full Name</label>
        <input type="Name"><br><br>
        <label>Age</label>
        <input type="age"><br><br>
        <label>Gender :</label><br>
        <label for="form1">Male</label>
        <input type="radio" id="Male" name="form1"><br>
        <label for="female">Female</label>
        <input type="radio" id="female" name="form1"><br>
        <label for="other">Other</label>
        <input type="radio" id="other" name="form1"><br><br>
        <label>Course :</label><br>
        <label for="form2">BCA</label>
        <input type="radio" id="bca" name="form2"><br>
        <label for="B.Sc">B.Sc</label>
        <input type="radio" id="b.sc" name="form2"><br>
        <label for="b.tech">B.Tech</label>
        <input type="radio" id="b.tech" name="form2"><br><br>
        <label>Skills :</label><br>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
        </select>
        <button>Reset</button>
    </form>
</body>
</html>
